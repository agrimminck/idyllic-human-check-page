<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Idyllic Captchaa</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
    <h2>Verificación Idyllic</h2>
    <form id="captcha-form" onsubmit="onSubmit(event)">
        <div class="g-recaptcha" data-sitekey="6LfZFOMrAAAAAIISq_nJKqP6HlSFgyZQQgdaD8Jm"></div>
        <br>
        <button type="submit">Verificar</button>
    </form>

    <script>
        function onSubmit(e) {
            e.preventDefault();
            const token = grecaptcha.getResponse();
            if (!token) {
                alert("Por favor completa el CAPTCHA");
                return;
            }

            const userId = getUserIdFromQuery();
            if (!userId) {
                alert("❌ No se encontró userId en la URL");
                return;
            }

            fetch(`http://localhost:4008/auth/captcha-verify`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, userId })
            })
                .then(res => {
                    if (!res.ok) throw new Error("Error al verificar CAPTCHA");
                    return res.json();
                })
                .then(data => alert("✅ CAPTCHA verificado. Vuelve al launcher"))
                .catch(err => console.error(err));
        }

    </script>
</body>

</html>
